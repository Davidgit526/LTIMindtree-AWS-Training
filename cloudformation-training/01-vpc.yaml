AWSTemplateFormatVersion: '2010-09-09'
Description: Create a training VPC

Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Training-VPC

Outputs:
  VPCId:
    Description: ID of the created VPC
    Value: !Ref MyVPC
    Export:
      Name: Training-VPC-ID
